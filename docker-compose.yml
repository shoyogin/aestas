# Aestas — backend + frontend + Postgres + Redis
# Run: docker compose up --build
# Frontend: http://localhost:5173
# Backend: http://localhost:8000

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: aestas-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep node_modules from image, don't overwrite with mount
    depends_on:
      backend: { condition: service_healthy }

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aestas-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aestas:aestas@postgres:5432/aestas
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:5173
      BACKEND_PUBLIC_URL: http://localhost:8000
      # Local dev is plain HTTP; set this to true anywhere served over HTTPS.
      COOKIE_SECURE: "false"
      LOG_LEVEL: INFO
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Readiness, not liveness: the frontend should wait for a backend that can
      # actually reach Postgres and Redis, not merely one that has booted.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aestas
      POSTGRES_PASSWORD: aestas
      POSTGRES_DB: aestas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aestas -d aestas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: {}
