name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # No `|| npm install` fallback: that hid lockfile drift instead of failing.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs shared/phase-cases.json, the same fixtures the backend asserts
      # against, so the two phase engines cannot drift apart unnoticed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aestas
          POSTGRES_PASSWORD: aestas
          POSTGRES_DB: aestas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aestas -d aestas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aestas:aestas@localhost:5432/aestas_test
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations apply and roll back
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Fails if the ORM and the migrations have drifted apart.
      - name: Schema matches the models
        run: alembic check

      - name: Test
        run: pytest

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t aestas-backend ./backend

      - name: Build frontend production image
        run: docker build --target production -t aestas-frontend ./frontend
